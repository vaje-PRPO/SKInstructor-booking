openapi: 3.0.3
info:
  title: SKInstructor Booking API
  description: Mikrostoritev za upravljanje rezervacij in urnikov smučarskih učiteljev.
  version: 1.0.0
paths:
  /bookings:
    post:
      summary: Ustvari novo rezervacijo
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Rezervacija je bila uspešno ustvarjena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /bookings/user/{userId}:
    get:
      summary: Pridobi vse rezervacije določenega uporabnika
      operationId: getUserBookings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Seznam uporabnikovih rezervacij
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
  /bookings/{id}/status:
    patch:
      summary: Posodobi status obstoječe rezervacije
      operationId: updateBookingStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingStatusUpdate'
      responses:
        '200':
          description: Status je bil uspešno posodobljen

components:
  schemas:
    BookingRequest:
      type: object
      required:
        - teacherId
        - userId
        - date
        - startTime
        - durationHours
      properties:
        teacherId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "10:00"
        durationHours:
          type: integer
    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teacherId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          type: string
        durationHours:
          type: integer
        totalPrice:
          type: number
          format: double
        status:
          type: string
          example: "PENDING"
    BookingStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "CONFIRMED"